name: Android native checks
on:
  push:
    paths: ['android/**', 'backend/**', 'api/**', 'sql/**', 'tests/native*', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android/**', 'backend/**', 'api/**', 'sql/**', 'tests/native*', '.github/workflows/android-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test token and RPW policies
        run: node --experimental-test-module-mocks --test tests/native*.test.mjs
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated debug APK and verify release packaging
        run: |
          python3 android/build.py --debug
          python3 android/build.py --unsigned
      - name: Package public Android signing verifier
        run: |
          mkdir -p android/build/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/build/signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: PNR-native-2.3-debug-and-unsigned
          path: |
            android/build/debug/PNR-*.apk
            android/build/debug/*.sha256
            android/build/release/PNR-*.apk
            android/build/release/*.sha256
            android/build/signing-tools/apksigner.jar
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native smoke tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screen-review
          path: android/build/screenshots/
          retention-days: 14
