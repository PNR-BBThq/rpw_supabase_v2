<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kemas Kini Sistem PNR Digital</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card-clear {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
        }
        .icon-loading { background: #dbeafe; color: #2563eb; }
        .icon-success { background: #dcfce7; color: #16a34a; }
        .icon-error { background: #fee2e2; color: #dc2626; }
        .progress-bar-custom {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }
        #statusLog {
            text-align: left;
            font-size: 13px;
            color: #64748b;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 15px;
        }
        #statusLog .log-item {
            padding: 3px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        #statusLog .log-ok { color: #16a34a; }
        #statusLog .log-warn { color: #d97706; }
    </style>
</head>
<body>
    <div class="card-clear">
        <div class="icon-wrap icon-loading" id="iconWrap">
            <i class="bi bi-arrow-repeat" id="iconMain" style="animation: spin 1s linear infinite;"></i>
        </div>
        <h4 id="titleText">Mengemas kini sistem...</h4>
        <p id="descText" class="text-muted mb-0">Sila tunggu sebentar. Sistem sedang membersihkan cache lama dan memuat turun versi terkini.</p>
        <div class="progress-bar-custom">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div id="statusLog"></div>
    </div>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <script>
    (async function() {
        var progress = document.getElementById('progressBar');
        var log = document.getElementById('statusLog');
        var icon = document.getElementById('iconWrap');
        var iconI = document.getElementById('iconMain');
        var title = document.getElementById('titleText');
        var desc = document.getElementById('descText');

        function addLog(msg, cls) {
            var div = document.createElement('div');
            div.className = 'log-item ' + (cls || '');
            div.textContent = '• ' + msg;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function setProgress(pct) { progress.style.width = pct + '%'; }

        try {
            // Langkah 1: Unregister semua Service Worker
            addLog('Menyemak Service Worker berdaftar...');
            setProgress(10);

            if ('serviceWorker' in navigator) {
                var regs = await navigator.serviceWorker.getRegistrations();
                if (regs.length > 0) {
                    for (var i = 0; i < regs.length; i++) {
                        await regs[i].unregister();
                        addLog('Service Worker dibuang: ' + regs[i].scope, 'log-ok');
                    }
                } else {
                    addLog('Tiada Service Worker aktif', 'log-warn');
                }
            } else {
                addLog('Service Worker tidak disokong', 'log-warn');
            }
            setProgress(35);

            // Langkah 2: Padam semua Cache Storage
            addLog('Membersihkan Cache Storage...');
            if ('caches' in window) {
                var keys = await caches.keys();
                if (keys.length > 0) {
                    for (var j = 0; j < keys.length; j++) {
                        await caches.delete(keys[j]);
                        addLog('Cache dipadam: ' + keys[j], 'log-ok');
                    }
                } else {
                    addLog('Tiada cache untuk dipadam', 'log-warn');
                }
            }
            setProgress(60);

            // Langkah 3: Paksa browser disk cache update dengan versi terkini
            addLog('Memaksa muat turun versi terkini dari server...');
            var freshHtml = await fetch('./index.html', { cache: 'reload' });
            addLog('index.html dimuat turun semula (' + freshHtml.status + ')', 'log-ok');
            setProgress(50);

            await fetch('./service-worker.js', { cache: 'reload' });
            addLog('service-worker.js dimuat turun semula', 'log-ok');
            await fetch('./css/style.css', { cache: 'reload' }).catch(function(){});
            addLog('Fail CSS dimuat turun semula', 'log-ok');
            setProgress(60);

            // Langkah 4: Baca APP_VERSION dari HTML terbaru supaya kill switch tak re-trigger
            addLog('Menyegerakkan penanda versi...');
            var htmlText = await freshHtml.clone().text();
            var versionMatch = htmlText.match(/var APP_VERSION = '([^']+)'/);
            if (versionMatch) {
                localStorage.setItem('PNR_APP_VERSION', versionMatch[1]);
                addLog('Versi app ditetapkan: ' + versionMatch[1], 'log-ok');
            }
            setProgress(70);

            // Langkah 5: Daftar Service Worker baru dan TUNGGU sehingga aktif
            if ('serviceWorker' in navigator) {
                addLog('Mendaftarkan Service Worker baru...');
                var reg = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
                var sw = reg.installing || reg.waiting || reg.active;
                if (sw && sw.state !== 'activated') {
                    await new Promise(function(resolve) {
                        sw.addEventListener('statechange', function() {
                            if (sw.state === 'activated') resolve();
                        });
                        setTimeout(resolve, 10000); // Timeout 10 saat
                    });
                }
                addLog('Service Worker baru aktif!', 'log-ok');
            }
            setProgress(90);

            // Langkah 6: Sedia untuk redirect
            addLog('Kemas kini selesai! Mengalih ke sistem utama...', 'log-ok');
            setProgress(100);

            // Tukar UI ke success
            icon.className = 'icon-wrap icon-success';
            iconI.className = 'bi bi-check-circle-fill';
            iconI.style.animation = 'none';
            title.textContent = 'Kemas Kini Berjaya!';
            desc.textContent = 'Anda akan dialihkan ke sistem utama dalam 3 saat...';

            // Redirect ke index.html selepas 3 saat
            setTimeout(function() {
                window.location.replace('./index.html?_cleared=' + Date.now());
            }, 3000);

        } catch (err) {
            icon.className = 'icon-wrap icon-error';
            iconI.className = 'bi bi-exclamation-triangle-fill';
            iconI.style.animation = 'none';
            title.textContent = 'Ralat Berlaku';
            desc.innerHTML = 'Sila cuba muat semula halaman ini.<br><small class="text-muted">' + err.message + '</small>';
            addLog('RALAT: ' + err.message, 'log-warn');
        }
    })();
    </script>
</body>
</html>
